name: Docker

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "infrastructure/**"
      - "Dockerfile*"
      - ".dockerignore"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "infrastructure/**"
      - "Dockerfile*"
      - ".dockerignore"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: |
          echo "name=${IMAGE_NAME@L}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('apps/api/**', 'apps/web/**', 'packages/**', 'Dockerfile*') }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare web build args
        shell: bash
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_APP_VERSION: ${{ vars.NEXT_PUBLIC_APP_VERSION }}
          NEXT_PUBLIC_FF_INTERVIEWS: ${{ vars.NEXT_PUBLIC_FF_INTERVIEWS }}
          NEXT_PUBLIC_FF_REPORTS: ${{ vars.NEXT_PUBLIC_FF_REPORTS }}
          NEXT_PUBLIC_FF_SETTINGS: ${{ vars.NEXT_PUBLIC_FF_SETTINGS }}
          NEXT_PUBLIC_FF_NEW_INTERVIEW: ${{ vars.NEXT_PUBLIC_FF_NEW_INTERVIEW }}
          NEXT_PUBLIC_FF_ANALYTICS: ${{ vars.NEXT_PUBLIC_FF_ANALYTICS }}
        run: |
          args_file="/tmp/web-build-args"
          : > "$args_file"
          for key in \
            NEXT_PUBLIC_API_URL \
            NEXT_PUBLIC_WS_URL \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_ANON_KEY \
            NEXT_PUBLIC_SENTRY_DSN \
            NEXT_PUBLIC_APP_VERSION \
            NEXT_PUBLIC_FF_INTERVIEWS \
            NEXT_PUBLIC_FF_REPORTS \
            NEXT_PUBLIC_FF_SETTINGS \
            NEXT_PUBLIC_FF_NEW_INTERVIEW \
            NEXT_PUBLIC_FF_ANALYTICS
          do
            if [ -n "${!key}" ]; then
              printf '%s=%s\n' "$key" "${!key}" >> "$args_file"
            fi
          done

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}-api:latest
            ghcr.io/${{ steps.image.outputs.name }}-api:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args-file: /tmp/web-build-args
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}-web:latest
            ghcr.io/${{ steps.image.outputs.name }}-web:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
