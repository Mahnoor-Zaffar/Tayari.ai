name: Docker

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "infrastructure/**"
      - "Dockerfile*"
      - ".dockerignore"
      - ".npmrc"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "infrastructure/**"
      - "Dockerfile*"
      - ".dockerignore"
      - ".npmrc"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: |
          echo "name=${IMAGE_NAME@L}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('apps/api/**', 'apps/web/**', 'packages/**', 'Dockerfile*') }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare web build args
        shell: bash
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_APP_VERSION: ${{ vars.NEXT_PUBLIC_APP_VERSION }}
          NEXT_PUBLIC_FF_INTERVIEWS: ${{ vars.NEXT_PUBLIC_FF_INTERVIEWS }}
          NEXT_PUBLIC_FF_REPORTS: ${{ vars.NEXT_PUBLIC_FF_REPORTS }}
          NEXT_PUBLIC_FF_SETTINGS: ${{ vars.NEXT_PUBLIC_FF_SETTINGS }}
          NEXT_PUBLIC_FF_NEW_INTERVIEW: ${{ vars.NEXT_PUBLIC_FF_NEW_INTERVIEW }}
          NEXT_PUBLIC_FF_ANALYTICS: ${{ vars.NEXT_PUBLIC_FF_ANALYTICS }}
        run: |
          args_file="/tmp/web-build-args"
          : > "$args_file"
          for key in \
            NEXT_PUBLIC_API_URL \
            NEXT_PUBLIC_WS_URL \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_ANON_KEY \
            NEXT_PUBLIC_SENTRY_DSN \
            NEXT_PUBLIC_APP_VERSION \
            NEXT_PUBLIC_FF_INTERVIEWS \
            NEXT_PUBLIC_FF_REPORTS \
            NEXT_PUBLIC_FF_SETTINGS \
            NEXT_PUBLIC_FF_NEW_INTERVIEW \
            NEXT_PUBLIC_FF_ANALYTICS
          do
            if [ -n "${!key}" ]; then
              printf '%s=%s\n' "$key" "${!key}" >> "$args_file"
            fi
          done

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}-api:latest
            ghcr.io/${{ steps.image.outputs.name }}-api:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: true
          build-args-file: /tmp/web-build-args
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}-web:latest
            ghcr.io/${{ steps.image.outputs.name }}-web:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Smoke test — migrate, boot, and health-check the stack
        shell: bash
        env:
          API_IMAGE: ghcr.io/${{ steps.image.outputs.name }}-api:latest
          WEB_IMAGE: ghcr.io/${{ steps.image.outputs.name }}-web:latest
        run: |
          set -euo pipefail
          NET=tayari-smoke
          cleanup() {
            docker rm -f smoke-api smoke-web smoke-db smoke-redis >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$NET"
          docker run -d --rm --network "$NET" --name smoke-db \
            -e POSTGRES_USER=tayari -e POSTGRES_PASSWORD=tayari_dev -e POSTGRES_DB=tayari \
            postgres:17-alpine
          docker run -d --rm --network "$NET" --name smoke-redis redis:7-alpine

          # Wait for postgres to accept connections
          for _ in $(seq 1 30); do
            if docker exec smoke-db pg_isready -U tayari >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec smoke-db pg_isready -U tayari >/dev/null

          # Apply migrations against a fresh database
          docker run --rm --network "$NET" \
            -e DATABASE_URL=postgresql+asyncpg://tayari:tayari_dev@smoke-db:5432/tayari \
            "$API_IMAGE" uv run alembic upgrade head

          # Confirm migrations actually created tables
          table_count="$(docker exec smoke-db psql -U tayari -d tayari -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")"
          echo "public tables after migrate: $table_count"
          [ "$table_count" -gt 0 ]

          # Boot the API image (production startup path — needs a valid JWT secret)
          docker run -d --rm --network "$NET" --name smoke-api \
            -e DATABASE_URL=postgresql+asyncpg://tayari:tayari_dev@smoke-db:5432/tayari \
            -e REDIS_URL=redis://smoke-redis:6379/0 \
            -e ENVIRONMENT=production \
            -e JWT_SECRET_KEY=smoke_test_SECRET_KEY_0123456789abcdefgh \
            -p 8000:8000 \
            "$API_IMAGE"

          # Readiness probe: status ok + database ok
          ready=""
          for _ in $(seq 1 40); do
            ready="$(curl -sf http://localhost:8000/ready 2>/dev/null || true)"
            [ -n "$ready" ] && echo "$ready" | grep -q '"status": *"ok"' && break
            sleep 2
          done
          echo "API /ready: $ready"
          [ -n "$ready" ]
          echo "$ready" | grep -q '"status": *"ok"'
          echo "$ready" | grep -q '"database": *"ok"'

          # Boot the Web image and confirm it serves the landing page
          docker run -d --rm --name smoke-web -p 3000:3000 "$WEB_IMAGE"
          web_ok=""
          for _ in $(seq 1 40); do
            web_ok="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000 2>/dev/null || true)"
            [ "$web_ok" = "200" ] && break
            sleep 2
          done
          echo "Web HTTP status: $web_ok"
          [ "$web_ok" = "200" ]

