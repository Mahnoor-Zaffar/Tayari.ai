# Fly.io app for the Tayari AI API (FastAPI + embedded Redis + APScheduler).
#
# First-time setup (run once, next to this file):
#   fly launch --no-deploy --copy-config --region <your-region>
#   fly postgres create --name tayari-pg        # managed Postgres
#   fly postgres attach tayari-pg               # sets DATABASE_URL (postgres://...)
#   ... then fix the scheme + set secrets (see docs/deployment.md) ...
# Then deploy with: fly deploy

app = "tayari-api"

[build]
  dockerfile = "Dockerfile"

# Non-secret production defaults. Secrets (DATABASE_URL, JWT_SECRET_KEY,
# OPENAI_API_KEY, RESEND_API_KEY, DEEPGRAM_API_KEY, ...) are set via
# `fly secrets set` so they never live in a config file.
[env]
  ENVIRONMENT = "production"
  JWT_ALGORITHM = "HS256"
  CORS_ORIGINS = '["https://tayari.ai", "https://www.tayari.ai"]'
  FRONTEND_URL = "https://tayari.ai"
  PUBLIC_API_URL = "https://api.tayari.ai"

[deploy]
  release_command = "uv run alembic upgrade head"

# Embedded redis-server (127.0.0.1:6379) + uvicorn both run inside this
# container; the Dockerfile CMD already launches redis then uvicorn on
# $PORT (Fly sets PORT to internal_port).
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [http_service.checks]
    [http_service.checks.ready]
      path = "/ready"
      interval = "30s"
      timeout = "5s"
      grace_period = "60s"

[vm]
  size = "shared-cpu-1x"
  memory = "512mb"  # python + embedded redis; drop to 256mb to fit the free allowance if unused