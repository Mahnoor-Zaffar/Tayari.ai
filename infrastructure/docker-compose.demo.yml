# Local LIVE demo via Cloudflare quick tunnels — self-contained, uses PROD images.
# Keep untracked (tunnel URLs are ephemeral). Not for production.
# Start:  cloudflared quick tunnels -> fill URLs below -> docker compose -f docker-compose.demo.yml up -d --build
name: tayari-demo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tayari
      POSTGRES_PASSWORD: tayari_dev
      POSTGRES_DB: tayari
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tayari"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: tayari
      MINIO_ROOT_PASSWORD: tayari_dev
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://tayari:tayari_dev@db:5432/tayari
      JWT_ALGORITHM: HS256
      JWT_SECRET_KEY: demo-local-secret-9f2a6c7e1b4d0f3a5c8e (dev-only, untracked demo stack)
      CORS_ORIGINS: '["https://sense-metropolitan-consequently-cognitive.trycloudflare.com"]'
      FRONTEND_URL: https://sense-metropolitan-consequently-cognitive.trycloudflare.com
      PUBLIC_API_URL: https://proudly-offered-demonstrates-motorcycles.trycloudflare.com/api/v1
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: tayari
      STORAGE_SECRET_KEY: tayari_dev
      STORAGE_BUCKET: tayari-evaluations
      STORAGE_REGION: us-east-1
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://proudly-offered-demonstrates-motorcycles.trycloudflare.com/api/v1
        NEXT_PUBLIC_WS_URL: wss://proudly-offered-demonstrates-motorcycles.trycloudflare.com/api/v1
        NEXT_PUBLIC_SITE_URL: https://sense-metropolitan-consequently-cognitive.trycloudflare.com
        NEXT_PUBLIC_FF_INTERVIEWS: "1"
        NEXT_PUBLIC_FF_REPORTS: "1"
        NEXT_PUBLIC_FF_SETTINGS: "1"
        NEXT_PUBLIC_FF_NEW_INTERVIEW: "1"
        NEXT_PUBLIC_FF_ANALYTICS: "1"
        NEXT_PUBLIC_APP_VERSION: "0.1.0"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  minio_data: